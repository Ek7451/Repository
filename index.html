<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLG Seating Bowl Study</title>
    <meta name="description" content="Redirecting to the seating bowl dashboard or configurator.">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f1113;
            color: #f5f7f1;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            max-width: 32rem;
            text-align: center;
        }

        a {
            color: #d8ecb1;
        }
    </style>
    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const target = params.get('project')
                ? './pages/configurator/index.html'
                : './pages/dashboard/dashboard.html';
            window.location.replace(`${target}${window.location.search}${window.location.hash}`);
        })();
    </script>
</head>
<body>
    <main>
        <p>Redirecting to the seating bowl app...</p>
        <noscript>
            <p>
                JavaScript is required for automatic routing.
                Open <a href="./pages/dashboard/dashboard.html">the dashboard</a>
                or <a href="./pages/configurator/index.html">the configurator</a>.
            </p>
        </noscript>
    </main>
</body>
</html>
